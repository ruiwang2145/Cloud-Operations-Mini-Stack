# Tool configuration that is not Django-specific.
#
# Only ruff lives here. Everything else -- pytest, coverage -- is configured in
# pytest.ini or on the command line, because a pyproject.toml that is the home of
# four different tools is the file nobody reads before changing.

[tool.ruff]
line-length = 100
target-version = "py310"          # the oldest version the project supports
exclude = [
    ".venv",
    "venv",
    "**/migrations/*",            # generated by Django; not ours to style
    "staticfiles",
]

[tool.ruff.lint]
# A deliberately small rule set.
#
# The point of a linter in a portfolio project is to catch mistakes, not to
# enforce a house style nobody agreed to. `E` (pycodestyle) and `W` are limited to
# the subsets that indicate real problems rather than formatting preferences;
# `F` catches unused imports and undefined names, which are always bugs; `B` is
# bugbear, which flags things like mutable default arguments and bare excepts;
# `I` keeps imports ordered so diffs stay small.
#
# E501 (line length) is intentionally *not* enabled: the code here is heavily
# commented on purpose, and a rule that forces comments to be wrapped mid-sentence
# makes them worse, not better.
select = ["E4", "E7", "E9", "F", "B", "I"]
ignore = [
    "B008",   # function call in argument default -- Django's idiom (Depends, etc.)
]

[tool.ruff.lint.isort]
known-first-party = ["my_cloudapp", "ops", "tasks"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, compare and reach into internals; that is what tests are for.
"**/tests/*" = ["B011", "S101"]
# Scripts deliberately import after manipulating sys.path, and use print() as
# their user interface.
"scripts/*" = ["E402"]
# A split settings module star-imports the base one on purpose -- that is the
# documented Django pattern for environment-specific overrides. Ruff cannot see
# through the star import, so it flags every inherited name.
"my_cloudapp/settings_test.py" = ["F405"]
